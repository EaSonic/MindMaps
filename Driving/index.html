<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#80c7f2" />
    <title>Coastline Drive</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="game" aria-label="Coastline Drive 3D driving game">
      <canvas id="world" aria-label="3D road and player car"></canvas>
      <div class="topbar">
        <div class="brand"><span class="brand-mark">●</span> Coastline Drive</div>
        <div class="score" aria-live="polite">
          <span class="score-label">DISTANCE</span>
          <strong id="distance">0.00 km</strong>
          <span class="score-divider"></span>
          <span class="score-label">BEST</span>
          <strong id="best">0.00 km</strong>
        </div>
        <button id="restart" class="restart" type="button" aria-label="Restart from the hills">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 1-2.1-5L20 7" /></svg>
          <span>Restart</span>
        </button>
      </div>
      <div class="zone-pill" id="zone">HILL ROAD</div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="tip" id="tip">Drive with arrow keys or the buttons below</div>
      <div class="controls" aria-label="Driving controls">
        <div class="control-pair steering">
          <button class="drive-button" data-control="left" type="button" aria-label="Steer left">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M27 10 13 24l14 14M14 24h23" /></svg>
          </button>
          <button class="drive-button" data-control="right" type="button" aria-label="Steer right">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m21 10 14 14-14 14M34 24H11" /></svg>
          </button>
        </div>
        <div class="control-pair pedals">
          <button class="drive-button" data-control="up" type="button" aria-label="Drive forward">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 27 24 13l14 14M24 14v23" /></svg>
          </button>
          <button class="drive-button" data-control="down" type="button" aria-label="Drive backward or brake">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m10 21 14 14 14-14M24 34V11" /></svg>
          </button>
        </div>
      </div>
      <div class="loading" id="loading">Preparing the road…</div>
    </main>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
